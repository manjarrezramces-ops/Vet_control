{% extends 'base.html' %}{% block title %}Movimiento · VetControl{% endblock %}{% block content %}<div class="page-head"><div><h1>Nuevo cargo o pago</h1><p>Cliente: <strong>{{ cliente.nombre }} {{ cliente.apellidos }}</strong></p></div></div><form class="card form" method="post"><div class="grid three"><label>Fecha<input type="date" name="fecha" value="{{ movimiento.fecha or today }}" required></label><label>Tipo<select name="tipo"><option>Cargo</option><option>Pago</option><option>Ajuste</option></select></label><label>Paciente<select name="paciente_id"><option value="">Cuenta general</option>{% for p in pacientes %}<option value="{{ p.id }}" {% if paciente_pre|string==p.id|string %}selected{% endif %}>{{ p.nombre }}</option>{% endfor %}</select></label></div><div class="grid two"><label>Concepto *<input name="concepto" required value="{{ movimiento.concepto or '' }}"></label><label>Importe *<input type="number" min="0" step="0.01" name="importe" required value="{{ movimiento.importe or '' }}"></label></div><div class="grid two"><label>Método de pago<select name="metodo_pago"><option value="">No aplica / pendiente</option>{% for m in ['Efectivo','Tarjeta','Transferencia','Depósito','Otro'] %}<option>{{ m }}</option>{% endfor %}</select></label><label>Referencia<input name="referencia"></label></div><label>Notas<textarea name="notas" rows="3"></textarea></label><div class="form-actions"><a class="btn ghost" href="{{ url_for('detalle_cliente',cliente_id=cliente.id) }}">Cancelar</a><button class="btn">Guardar movimiento</button></div></form>{% endblock %}
