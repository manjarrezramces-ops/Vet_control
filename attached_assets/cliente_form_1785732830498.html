{% extends 'base.html' %}{% block title %}{{ titulo }} · VetControl{% endblock %}{% block content %}<div class="page-head"><div><h1>{{ titulo }}</h1><p>Datos de contacto y facturación.</p></div></div><form class="card form" method="post">
<div class="grid two"><label>Nombre *<input name="nombre" required value="{{ cliente.nombre or '' }}"></label><label>Apellidos<input name="apellidos" value="{{ cliente.apellidos or '' }}"></label></div><div class="grid two"><label>Teléfono *<input name="telefono" required value="{{ cliente.telefono or '' }}"></label><label>Teléfono alterno<input name="telefono_alterno" value="{{ cliente.telefono_alterno or '' }}"></label></div><div class="grid two"><label>Correo<input type="email" name="email" value="{{ cliente.email or '' }}"></label><label>RFC<input name="rfc" value="{{ cliente.rfc or '' }}"></label></div><label>Dirección<textarea name="direccion" rows="3">{{ cliente.direccion or '' }}</textarea></label><label>Notas<textarea name="notas" rows="4">{{ cliente.notas or '' }}</textarea></label><div class="form-actions"><a class="btn ghost" href="{{ url_for('clientes') }}">Cancelar</a><button class="btn">Guardar</button></div></form>{% endblock %}
