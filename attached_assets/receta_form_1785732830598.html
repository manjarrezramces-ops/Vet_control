{% extends 'base.html' %}{% block title %}Nueva receta · VetControl{% endblock %}{% block content %}
<div class="page-head"><div><h1>Nueva receta</h1><p>Paciente: <strong>{{ paciente.nombre }}</strong></p></div></div>
<form class="card form" method="post"><div class="grid three"><label>Fecha<input type="date" name="fecha" value="{{ receta.fecha or today }}" required></label><label>Médico veterinario<input name="medico" value="{{ receta.medico or '' }}"></label><label>Consulta relacionada<select name="consulta_id"><option value="">Sin relacionar</option>{% for c in consultas %}<option value="{{ c.id }}">{{ format_date(c.fecha) }} · {{ c.motivo }}</option>{% endfor %}</select></label></div><h3>Medicamentos</h3><div id="medicamentos"><div class="medicine-row"><div class="grid four"><label>Medicamento *<input name="medicamento[]"></label><label>Presentación<input name="presentacion[]"></label><label>Dosis *<input name="dosis[]"></label><label>Vía<input name="via[]"></label></div><div class="grid three"><label>Frecuencia<input name="frecuencia[]"></label><label>Duración<input name="duracion[]"></label><label>Instrucciones<input name="instrucciones[]"></label></div></div></div><button class="btn secondary" type="button" id="add-med">+ Otro medicamento</button><label>Indicaciones generales<textarea name="indicaciones_generales" rows="4"></textarea></label><label>Próxima revisión<input type="date" name="proxima_revision"></label><div class="form-actions"><a class="btn ghost" href="{{ url_for('detalle_paciente',paciente_id=paciente.id) }}">Cancelar</a><button class="btn">Guardar receta</button></div></form>
{% endblock %}{% block scripts %}<script>document.getElementById('add-med').onclick=()=>{const first=document.querySelector('.medicine-row');const clone=first.cloneNode(true);clone.querySelectorAll('input').forEach(i=>i.value='');document.getElementById('medicamentos').appendChild(clone)};</script>{% endblock %}
