{% extends 'base.html' %}{% block title %}{{ titulo }} · VetControl{% endblock %}{% block content %}<div class="page-head"><div><h1>{{ titulo }}</h1><p>Ficha de identificación y antecedentes.</p></div></div><form class="card form" method="post"><label>Propietario *<select name="cliente_id" required><option value="">Seleccionar…</option>{% for c in clientes %}<option value="{{ c.id }}" {% if paciente.cliente_id|string==c.id|string %}selected{% endif %}>{{ c.apellidos }}, {{ c.nombre }}</option>{% endfor %}</select></label><div class="grid three"><label>Nombre *<input name="nombre" required value="{{ paciente.nombre or '' }}"></label><label>Especie *<select name="especie" required><option value="">Seleccionar…</option>{% for e in ['Perro','Gato','Ave','Conejo','Reptil','Otro'] %}<option {% if paciente.especie==e %}selected{% endif %}>{{ e }}</option>{% endfor %}</select></label><label>Raza<input name="raza" value="{{ paciente.raza or '' }}"></label></div><div class="grid three"><label>Sexo<select name="sexo"><option value="">No especificado</option><option {% if paciente.sexo=='Macho' %}selected{% endif %}>Macho</option><option {% if paciente.sexo=='Hembra' %}selected{% endif %}>Hembra</option></select></label><label>Fecha de nacimiento<input type="date" name="fecha_nacimiento" value="{{ paciente.fecha_nacimiento or '' }}"></label><label>Color<input name="color" value="{{ paciente.color or '' }}"></label></div><div class="grid four"><label>Peso actual (kg)<input type="number" step="0.01" min="0" name="peso" value="{{ paciente.peso or '' }}"></label><label>Microchip<input name="microchip" value="{{ paciente.microchip or '' }}"></label><label>Esterilizado<select name="esterilizado"><option value="0" {% if not paciente.esterilizado %}selected{% endif %}>No</option><option value="1" {% if paciente.esterilizado %}selected{% endif %}>Sí</option></select></label><label>Estado<select name="estado"><option {% if paciente.estado=='Activo' %}selected{% endif %}>Activo</option><option {% if paciente.estado=='Inactivo' %}selected{% endif %}>Inactivo</option><option {% if paciente.estado=='Fallecido' %}selected{% endif %}>Fallecido</option></select></label></div><label>Alergias<textarea name="alergias" rows="3">{{ paciente.alergias or '' }}</textarea></label><label>Antecedentes clínicos<textarea name="antecedentes" rows="4">{{ paciente.antecedentes or '' }}</textarea></label><div class="grid two"><label>Vacunación / desparasitación<textarea name="vacunas" rows="4">{{ paciente.vacunas or '' }}</textarea></label><label>Alimentación<textarea name="alimentacion" rows="4">{{ paciente.alimentacion or '' }}</textarea></label></div><div class="form-actions"><a class="btn ghost" href="{{ url_for('pacientes') }}">Cancelar</a><button class="btn">Guardar</button></div></form>{% endblock %}
