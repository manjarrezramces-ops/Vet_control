{% extends 'base.html' %}{% block title %}{{ titulo }} · VetControl{% endblock %}{% block content %}<div class="page-head"><div><h1>{{ titulo }}</h1><p>Paciente: <strong>{{ paciente.nombre }}</strong></p></div></div><form class="card form" method="post"><div class="grid four"><label>Fecha *<input type="date" name="fecha" required value="{{ consulta.fecha or today }}"></label><label>Hora<input type="time" name="hora" value="{{ consulta.hora or '' }}"></label><label>Médico veterinario<input name="medico" value="{{ consulta.medico or '' }}"></label><label>Motivo *<input name="motivo" required value="{{ consulta.motivo or '' }}"></label></div><label>Anamnesis<textarea name="anamnesis" rows="5">{{ consulta.anamnesis or '' }}</textarea></label><label>Exploración física<textarea name="exploracion_fisica" rows="5">{{ consulta.exploracion_fisica or '' }}</textarea></label><h3>Constantes</h3><div class="grid four"><label>Peso (kg)<input type="number" step="0.01" min="0" name="peso" value="{{ consulta.peso or '' }}"></label><label>Temperatura (°C)<input type="number" step="0.1" name="temperatura" value="{{ consulta.temperatura or '' }}"></label><label>FC (lpm)<input type="number" min="0" name="frecuencia_cardiaca" value="{{ consulta.frecuencia_cardiaca or '' }}"></label><label>FR (rpm)<input type="number" min="0" name="frecuencia_respiratoria" value="{{ consulta.frecuencia_respiratoria or '' }}"></label></div><div class="grid three"><label>Mucosas<input name="mucosas" value="{{ consulta.mucosas or '' }}"></label><label>TRC<input name="trc" value="{{ consulta.trc or '' }}"></label><label>Condición corporal<input name="condicion_corporal" value="{{ consulta.condicion_corporal or '' }}"></label></div><label>Diagnóstico<textarea name="diagnostico" rows="4">{{ consulta.diagnostico or '' }}</textarea></label><label>Diagnósticos diferenciales<textarea name="diagnosticos_diferenciales" rows="3">{{ consulta.diagnosticos_diferenciales or '' }}</textarea></label><label>Plan diagnóstico / terapéutico<textarea name="plan" rows="4">{{ consulta.plan or '' }}</textarea></label><label>Tratamiento<textarea name="tratamiento" rows="5">{{ consulta.tratamiento or '' }}</textarea></label><div class="grid two"><label>Pronóstico<input name="pronostico" value="{{ consulta.pronostico or '' }}"></label><label>Próxima cita<input type="date" name="proxima_cita" value="{{ consulta.proxima_cita or '' }}"></label></div><label>Observaciones<textarea name="observaciones" rows="4">{{ consulta.observaciones or '' }}</textarea></label><div class="form-actions"><a class="btn ghost" href="{{ url_for('detalle_paciente',paciente_id=paciente.id) }}">Cancelar</a><button class="btn">Guardar consulta</button></div></form>{% endblock %}
