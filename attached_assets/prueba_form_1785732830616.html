{% extends 'base.html' %}{% block title %}Nueva prueba · VetControl{% endblock %}{% block content %}
<div class="page-head"><div><h1>Nueva prueba diagnóstica</h1><p>Paciente: <strong>{{ paciente.nombre }}</strong></p></div></div>
<form class="card form" method="post"><div class="grid three"><label>Fecha<input type="date" name="fecha" value="{{ prueba.fecha or today }}" required></label><label>Tipo<select name="tipo">{% for t in ['Laboratorio','Imagenología','Prueba rápida','Citología','Histopatología','Otro'] %}<option {% if prueba.tipo==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></label><label>Consulta relacionada<select name="consulta_id"><option value="">Sin relacionar</option>{% for c in consultas %}<option value="{{ c.id }}">{{ format_date(c.fecha) }} · {{ c.motivo }}</option>{% endfor %}</select></label></div><div class="grid two"><label>Nombre de la prueba *<input name="nombre" required value="{{ prueba.nombre or '' }}"></label><label>Laboratorio / proveedor<input name="laboratorio" value="{{ prueba.laboratorio or '' }}"></label></div><label>Resultado<textarea name="resultado" rows="5">{{ prueba.resultado or '' }}</textarea></label><label>Interpretación<textarea name="interpretacion" rows="4">{{ prueba.interpretacion or '' }}</textarea></label><label>Costo<input type="number" min="0" step="0.01" name="costo" value="{{ prueba.costo or 0 }}"></label><div class="form-actions"><a class="btn ghost" href="{{ url_for('detalle_paciente',paciente_id=paciente.id) }}">Cancelar</a><button class="btn">Guardar prueba</button></div></form>{% endblock %}
