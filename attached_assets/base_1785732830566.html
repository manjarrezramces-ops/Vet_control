<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}VetControl{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}"></head><body>
<header class="topbar"><a class="brand" href="{{ url_for('dashboard') }}">VetControl</a><nav><a href="{{ url_for('dashboard') }}">Inicio</a><a href="{{ url_for('clientes') }}">Clientes</a><a href="{{ url_for('pacientes') }}">Pacientes</a></nav></header>
<main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<script>document.querySelectorAll('[data-confirm]').forEach(f=>f.addEventListener('submit',e=>{if(!confirm(f.dataset.confirm))e.preventDefault()}));</script>{% block scripts %}{% endblock %}</body></html>
